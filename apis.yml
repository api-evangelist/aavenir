description: 'Aavenir is an AI-powered contract lifecycle management (CLM) and source-to-pay software
  company that delivers procurement, legal, and finance workflow automation applications built natively
  on the ServiceNow platform. Its product suite includes Contractflow (contract lifecycle management),
  Obligationflow (contract obligation and compliance management), Sourcingflow (RFx and strategic
  sourcing), and Invoiceflow (accounts-payable invoice automation), using natural language processing
  and machine learning to digitize contracts, invoices, and procurement processes. Surfaced as a
  portfolio company of Accel and added to the API Evangelist network for enrichment.'
